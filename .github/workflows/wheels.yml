name: Build Python wheels

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: ${{ matrix.platform }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_x86_64
            arch: x86_64
            build: >-
              cp310-manylinux_x86_64 cp311-manylinux_x86_64
              cp312-manylinux_x86_64 cp313-manylinux_x86_64
          - os: macos-14
            platform: macosx_arm64
            arch: arm64
            build: >-
              cp310-macosx_arm64 cp311-macosx_arm64
              cp312-macosx_arm64 cp313-macosx_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up native dependencies
        if: runner.os == 'macOS'
        uses: mamba-org/setup-micromamba@v2.0.1
        with:
          environment-name: apm-wheel
          create-args: >-
            armadillo
            boost-cpp
            libblas=*=*openblas
            liblapack=*=*openblas
          cache-environment: true

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.4.0
        with:
          package-dir: ./python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.build }}
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y armadillo-devel boost-devel
            openblas-devel lapack-devel
          CIBW_TEST_COMMAND: python -m pytest {project}/python/tests
          CIBW_TEST_REQUIRES: pytest
          CIBW_ENVIRONMENT_MACOS: >-
            CPATH=/Users/runner/micromamba/envs/apm-wheel/include

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: apm-${{ matrix.platform }}-wheels
          path: wheelhouse/*.whl
          if-no-files-found: error
