[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.10",
]
build-backend = "setuptools.build_meta"

[project]
name = "apm"
version = "0.1.0"
description = "Python bindings for the Aggregated Projection Matrix method"
authors = [
    {name = "Brad Ross", email = "rossb@nber.org"},
    {name = "Lihua Lei", email = "lihualei@stanford.edu"},
    {name = "Apoorva Lal"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "polars>=0.20.4",
]

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "numpy",
]
demo = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=6.0", 
    "numpy",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/brad-ross/apm"
Repository = "https://github.com/brad-ross/apm.git"
Issues = "https://github.com/brad-ross/apm/issues"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
